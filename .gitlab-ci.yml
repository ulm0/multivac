# ORDER IS LOAD-BEARING, and it looks like formatting. `deploy` must follow
# `publish`: on a tag both run, and a site deployed first would announce a
# package the registry has not accepted — the same falsehood this ordering was
# introduced to remove, one minute long instead of forever (MV-77). A failed
# publish leaves the deploy unrun.
stages:
  - test
  - publish
  - deploy

test:
  stage: test
  image: node:24
  # A tag runs the publish job and nothing else. The commit a tag names has
  # already been through this job on its way to main, so re-running it here is
  # duplication that only delays the release and adds a second way for it to
  # fail.
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: on_success
  before_script:
    - corepack enable
    - corepack prepare --activate  # the version is package.json's packageManager, not a second pin
  script:
    - pnpm install --frozen-lockfile
    - pnpm test
  cache:
    key: pnpm
    paths:
      - .pnpm-store/
  variables:
    PNPM_HOME: "$CI_PROJECT_DIR/.pnpm-store"
    npm_config_store_dir: "$CI_PROJECT_DIR/.pnpm-store"

# The tool gates its own repo: this repo is its own brain (.multivac/invariants.md),
# and every push re-verifies the law against the source.
selfverify:
  stage: test
  image: node:24
  # A tag runs the publish job and nothing else. The commit a tag names has
  # already been through the test job and this one on its way to main, so re-running it here is
  # duplication that only delays the release and adds a second way for it to
  # fail.
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: on_success
  before_script:
    - corepack enable
    - corepack prepare --activate  # the version is package.json's packageManager, not a second pin
  script:
    - pnpm install --frozen-lockfile
    - pnpm run build
    - node dist/cli.js verify --strict
  cache:
    key: pnpm
    paths:
      - .pnpm-store/
  variables:
    PNPM_HOME: "$CI_PROJECT_DIR/.pnpm-store"
    npm_config_store_dir: "$CI_PROJECT_DIR/.pnpm-store"

pages:
  stage: deploy
  image: hugomods/hugo:std-go-git-0.165.0
  script:
    # The badge shows what is PUBLISHED, never what package.json declares: the
    # manifest is bumped in a merge that precedes the tag, so advertising it
    # would name a version nobody can install — and an abandoned release would
    # advertise it forever. The last tag is the published version by MV-68,
    # which refuses to publish under a tag that disagrees with the manifest.
    - export HUGO_PARAMS_RELEASE=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo dev)
    - cd site
    - hugo --minify --baseURL https://multivac.ulm0.com/
    - mv public ../public
  cache:
    key: hugo-go-mod
    paths:
      - .gomodcache/
  variables:
    GOMODCACHE: "$CI_PROJECT_DIR/.gomodcache"
    # Tags are the version source below, and GitLab clones shallow by default —
    # without this `git describe` finds nothing and the badge renders `dev` in
    # production without saying so. A quiet wrong answer is the failure mode
    # this whole arrangement exists to remove (MV-77).
    GIT_DEPTH: 0
  artifacts:
    paths:
      - public
  rules:
    # A release moves the badge at once rather than at the next unrelated
    # merge; `publish` is an earlier stage, so this cannot run ahead of it.
    - if: '$CI_COMMIT_TAG'
    # And site-only corrections reach readers without a release being cut.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Releasing multivac, which is not the same thing as using it: multivac itself
# runs in the agent session and the docs say so. What a pipeline is for here is
# putting a tarball on a registry, and doing it without a long-lived token.
#
# Trusted publishing (OIDC): npm mints a short-lived credential from the token
# GitLab issues for this exact project + ref, so no long-lived publish token
# exists to leak, rotate, or paste into a chat. Configure the other half at
# npmjs.com -> multivac -> Settings -> Trusted publisher:
#   namespace: ulm0 · project: multivac · CI file path: .gitlab-ci.yml
#
# Tag-driven, and the tag must match the version in package.json — a release is
# a decision somebody makes on purpose, never a side effect of a merge.
publish:
  stage: publish
  image: node:24
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  before_script:
    - corepack enable
    - corepack prepare --activate
    # npm's OIDC support landed in 11.5.1; node:24 ships older.
    - npm install -g npm@latest
  script:
    - pnpm install --frozen-lockfile
    # Build, because the tarball ships dist/ and nothing else produces it here.
    - pnpm run build
    # The tag is the authority on what is being released, and this is the one
    # check that cannot have been made earlier: it is about the tag itself.
    - test "v$(node -p 'require("./package.json").version')" = "$CI_COMMIT_TAG"
    - npm publish --access public
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
