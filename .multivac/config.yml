# multivac configuration — seeded by `multivac init`.
# Edit directly; adopting a new agent later is one line here + `multivac doors`.
# Single-repo ecosystem: the brain IS the code repo. Anchors target the
# implicit `brain` key; `self` exists so the change lifecycle can declare
# changes that land in this very repo.
doors: [agents]
authorities: [published, specified, open]
repos:
  self: .
