<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 112" width="128" height="112" role="img" aria-label="multivac">
  <!-- The navbar copy. An <img> is an isolated document where currentColor
       falls back to black, so the ink is pinned light — the only ground this
       site has. mark.svg keeps currentColor for inline use. -->
  <rect x="6" y="6" width="116" height="100" rx="16" fill="none" stroke="#f2f2f2" stroke-width="7"/>
  <g fill="#f2f2f2">
    <circle cx="36" cy="41" r="9.5"/><circle cx="64" cy="41" r="9.5"/><circle cx="92" cy="71" r="9.5"/>
  </g>
  <g fill="none" stroke="#f2f2f2" stroke-width="5.5">
    <circle cx="92" cy="41" r="9.5"/><circle cx="36" cy="71" r="9.5"/>
  </g>
  <circle cx="64" cy="71" r="9.5" fill="#c3f53c"/>
</svg>
