<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 112" width="128" height="112" role="img" aria-label="multivac">
  <!-- the console panel: lit lamps are verified claims, unlit are unanchored,
       acid is the one in flight. Ink is currentColor; the accent is fixed —
       #c3f53c on dark, #6f8f00 where it must sit on light. -->
  <rect x="6" y="6" width="116" height="100" rx="16" fill="none" stroke="currentColor" stroke-width="7"/>
  <g fill="currentColor">
    <circle cx="36" cy="41" r="9.5"/><circle cx="64" cy="41" r="9.5"/><circle cx="92" cy="71" r="9.5"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="5.5">
    <circle cx="92" cy="41" r="9.5"/><circle cx="36" cy="71" r="9.5"/>
  </g>
  <circle cx="64" cy="71" r="9.5" fill="#c3f53c"/>
</svg>
