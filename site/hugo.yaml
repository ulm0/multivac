baseURL: https://multivac.ulm0.com/
# MV-100. `locale:` was here and is not a Hugo key — an inert line that looked
# like a setting. `languageCode` is the one Hugo reads, and it is what puts the
# language on <html> and lets `og:locale` be stated rather than guessed.
languageCode: en-US
title: multivac

# MV-100. Without this the crawler file 404s while the sitemap it should name
# returns 200 — the map exists and nothing points at it.
enableRobotsTXT: true

# MV-100. Every sitemap entry shipped without a <lastmod>, because no page
# declares a date and nothing derived one. Git already knows when each page
# last changed, so the freshness signal costs a switch rather than a field
# nobody would maintain.
enableGitInfo: true

# MV-100. `/categories/` and `/tags/` were in the sitemap: two pages with no
# content, generated because the taxonomies exist by default and used by
# nothing here. Thin pages in an index are a cost, not an omission.
disableKinds:
  - taxonomy
  - term

module:
  imports:
    - path: github.com/imfing/hextra
  # The changelog is mounted, never copied. One file serves both surfaces, so
  # the two cannot disagree — there is no second copy to forget (MV-78).
  # Declaring any content mount replaces the default, so `content` is restated
  # here alongside it.
  mounts:
    - source: content
      target: content
    - source: ../CHANGELOG.md
      target: content/docs/changelog.md

enableInlineShortcodes: true

markup:
  # Hextra's layout shortcodes — hero, feature grid, cards — emit their own
  # wrapper HTML. Goldmark strips raw HTML unless this is on, which leaves the
  # landing as unstyled paragraphs.
  goldmark:
    renderer:
      unsafe: true
  # Hextra ships the highlight CSS; noClasses: true would inline Chroma's own
  # colors instead and ignore the dark theme.
  highlight:
    noClasses: false

menu:
  main:
    - name: Docs
      pageRef: /docs
      weight: 1
    - name: GitLab
      url: https://gitlab.com/ulm0/multivac
      weight: 2
    - name: Search
      weight: 3
      params:
        type: search

params:
  # MV-100. Two declarations, and they fix a head that served an EMPTY
  # description and no card image at all — which is why a pasted link rendered
  # as a bare URL: a scraper that finds no image does not fall back to a
  # favicon.
  #
  # No template is written for either. The theme emits `og:image` from
  # `images` and emits none without it, and Hugo's own card partial picks the
  # large format the moment an image exists — so the format follows from the
  # same declaration rather than being stated twice. Nothing was broken here;
  # nothing had been declared.
  #
  # `description` is the FALLBACK. Every page that can carry its own carries
  # it, because the theme otherwise derives one from whatever prose happens to
  # come first — a sentence written to open a section, not to describe a page.
  description: >-
    Brain-driven development: one brain repo of anchored claims, verified
    against the code before an agent acts on it. Deterministic, offline, no
    model in the verification path.
  images:
    - og.png

  # The version the badge shows. NOT a fact about this repository: the pages
  # job overrides it with the last git tag, which is the last version actually
  # published (MV-77). `dev` is what a local build or a fork with no releases
  # renders — it names itself rather than showing a number nobody can install,
  # and it is not a semver, so MV-84's count=0 stays satisfied.
  release: dev
  externalLinkDecoration: true
  navbar:
    displayTitle: true
    displayLogo: true
    # The mark is the console panel — lit lamps verified, unlit unanchored,
    # acid in flight. An <img> is an isolated document where currentColor falls
    # back to black, so the navbar copy pins its ink light; this site has one
    # ground and needs no per-theme slot.
    logo:
      path: mark-dark.svg
      width: 23
      height: 20

  # Dark only. The mark's accent is acid lime, which reads as acid on a dark
  # ground and has to darken to olive on light — a second, quieter identity for
  # the same product. One ground, one palette, no toggle.
  theme:
    default: dark
    displayToggle: false

  page:
    width: normal

  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: false

  editURL:
    enable: false

  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
