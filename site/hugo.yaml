baseURL: https://multivac.ulm0.com/
locale: en-us
title: multivac

module:
  imports:
    - path: github.com/imfing/hextra
  # The changelog is mounted, never copied. One file serves both surfaces, so
  # the two cannot disagree — there is no second copy to forget (MV-78).
  # Declaring any content mount replaces the default, so `content` is restated
  # here alongside it.
  mounts:
    - source: content
      target: content
    - source: ../CHANGELOG.md
      target: content/docs/changelog.md

enableInlineShortcodes: true

markup:
  # Hextra's layout shortcodes — hero, feature grid, cards — emit their own
  # wrapper HTML. Goldmark strips raw HTML unless this is on, which leaves the
  # landing as unstyled paragraphs.
  goldmark:
    renderer:
      unsafe: true
  # Hextra ships the highlight CSS; noClasses: true would inline Chroma's own
  # colors instead and ignore the dark theme.
  highlight:
    noClasses: false

menu:
  main:
    - name: Docs
      pageRef: /docs
      weight: 1
    - name: GitLab
      url: https://gitlab.com/ulm0/multivac
      weight: 2
    - name: Search
      weight: 3
      params:
        type: search

params:
  # The version the badge shows. NOT a fact about this repository: the pages
  # job overrides it with the last git tag, which is the last version actually
  # published (MV-77). `dev` is what a local build or a fork with no releases
  # renders — it names itself rather than showing a number nobody can install,
  # and it is not a semver, so MV-84's count=0 stays satisfied.
  release: dev
  externalLinkDecoration: true
  navbar:
    displayTitle: true
    displayLogo: true
    # The mark is the console panel — lit lamps verified, unlit unanchored,
    # acid in flight. An <img> is an isolated document where currentColor falls
    # back to black, so the navbar copy pins its ink light; this site has one
    # ground and needs no per-theme slot.
    logo:
      path: mark-dark.svg
      width: 23
      height: 20

  # Dark only. The mark's accent is acid lime, which reads as acid on a dark
  # ground and has to darken to olive on light — a second, quieter identity for
  # the same product. One ground, one palette, no toggle.
  theme:
    default: dark
    displayToggle: false

  page:
    width: normal

  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: false

  editURL:
    enable: false

  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
