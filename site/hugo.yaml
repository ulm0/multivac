baseURL: https://multivac.ulm0.com/
locale: en-us
title: multivac

module:
  imports:
    - path: github.com/imfing/hextra

enableInlineShortcodes: true

markup:
  # Hextra's layout shortcodes — hero, feature grid, cards — emit their own
  # wrapper HTML. Goldmark strips raw HTML unless this is on, which leaves the
  # landing as unstyled paragraphs.
  goldmark:
    renderer:
      unsafe: true
  # Hextra ships the highlight CSS; noClasses: true would inline Chroma's own
  # colors instead and ignore the dark theme.
  highlight:
    noClasses: false

menu:
  main:
    - name: Docs
      pageRef: /docs
      weight: 1
    - name: GitLab
      url: https://gitlab.com/ulm0/multivac
      weight: 2
    - name: Search
      weight: 3
      params:
        type: search

params:
  navbar:
    displayTitle: true
    displayLogo: true
    # The mark is the console panel — lit lamps verified, unlit unanchored,
    # amber in flight. Hextra renders one <img> per theme, and an <img> is an
    # isolated document where currentColor falls back to black, so the dark
    # slot carries the same drawing with its ink pinned.
    logo:
      path: mark.svg
      dark: mark-dark.svg
      width: 23
      height: 20

  theme:
    default: dark
    displayToggle: true

  page:
    width: normal

  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: false

  editURL:
    enable: false

  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
